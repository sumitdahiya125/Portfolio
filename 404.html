<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — Sumit Kumar</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='80' font-family='Georgia,serif' fill='%23d97757'%3ESK%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/Portfolio/style.css" />
    <style>
      .nf {
        max-width: 720px;
        margin: 0 auto;
        padding: 120px 32px 80px;
        text-align: left;
      }
      .nf__code {
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        color: var(--accent);
        margin: 0 0 14px;
        letter-spacing: 0.02em;
      }
      .nf__title {
        font-family: "Fraunces", "Iowan Old Style", Georgia, serif;
        font-size: clamp(48px, 7vw, 80px);
        font-style: italic;
        font-weight: 500;
        line-height: 1;
        letter-spacing: -0.03em;
        margin: 0 0 28px;
      }
      .nf__copy {
        font-size: 18px;
        color: var(--text-dim);
        line-height: 1.7;
        margin: 0 0 32px;
      }
      .nf__back a {
        font-family: "JetBrains Mono", monospace;
        font-size: 14px;
        color: var(--text);
        border-bottom: 1px solid var(--border-strong);
        padding-bottom: 2px;
        transition: color 0.15s, border-color 0.15s;
      }
      .nf__back a:hover {
        color: var(--accent);
        border-bottom-color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>
    <main class="nf">
      <p class="nf__code">404 / page-not-found</p>
      <h1 class="nf__title">That page is somewhere else.</h1>
      <p class="nf__copy">
        Either the URL is wrong or this page has been deprecated. Either way,
        there's nothing here.
      </p>
      <p class="nf__back">
        <a href="/Portfolio/">← Back home</a>
      </p>
    </main>

    <!-- GoatCounter analytics — track 404 hits so I can see broken links -->
    <script
      data-goatcounter="https://sumitkumar.goatcounter.com/count"
      async
      src="//gc.zgo.at/count.js"
    ></script>
  </body>
</html>
